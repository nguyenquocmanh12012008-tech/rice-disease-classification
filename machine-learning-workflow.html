<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quy trình Machine Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --accent-tint: rgba(191, 69, 32, 0.08);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 40px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1280px; min-width: 0; margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 8px/1.4 var(--mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font: 400 32px/1.15 var(--serif);
      letter-spacing: -.02em;
    }
    .intro {
      max-width: 680px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .diagram-container { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Machine Learning · Quy trình</p>
    <h1>Từ dữ liệu đến mô hình vận hành</h1>
    <p class="intro">Quy trình gồm bảy bước, từ thu thập dữ liệu đến khi đưa mô hình vào sử dụng. Nếu mô hình chưa đạt yêu cầu đánh giá, hãy điều chỉnh rồi huấn luyện lại.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ml-workflow-title ml-workflow-desc">
        <title id="ml-workflow-title">Quy trình Machine Learning</title>
        <desc id="ml-workflow-desc">Sơ đồ thể hiện các bước từ thu thập dữ liệu đến triển khai mô hình. Khi kết quả đánh giá chưa đạt yêu cầu, quy trình quay lại bước huấn luyện.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r=".8" fill="rgba(45,49,66,.08)"/>
          </pattern>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect width="1280" height="720" fill="url(#dots)" opacity=".3"/>

        <!-- Main pipeline connectors, drawn behind the nodes. -->
        <path d="M300 232 H352" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M608 232 H660" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M916 232 H968" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M1096 276 V420" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M968 464 H916" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M660 464 H566" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M398 462 H300" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

        <!-- Feedback: a failed evaluation returns to model training. -->
        <path d="M482 532 V596 Q482 604 490 604 H1088 Q1096 604 1096 596 V508" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

        <!-- Decision branch labels sit on opaque masks, clear of their strokes. -->
        <rect x="328" y="444" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="348" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing=".06em">ĐẠT</text>
        <rect x="488" y="548" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="522" y="557" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing=".06em">CHƯA ĐẠT</text>
        <rect x="736" y="580" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="776" y="589" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing=".06em">ĐIỀU CHỈNH</text>

        <!-- Step 1: dataset collection. -->
        <rect x="44" y="188" width="256" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".14em">01 / NGUỒN</text>
        <text x="64" y="240" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Thu thập dữ liệu</text>
        <text x="64" y="261" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Nguồn và nhãn phù hợp</text>

        <!-- Step 2: cleaning. -->
        <rect x="352" y="188" width="256" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="372" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".14em">02 / CHUẨN BỊ</text>
        <text x="372" y="240" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Làm sạch dữ liệu</text>
        <text x="372" y="261" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Thiếu, trùng, sai định dạng</text>

        <!-- Step 3: feature engineering. -->
        <rect x="660" y="188" width="256" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".14em">03 / BIỂU DIỄN</text>
        <text x="680" y="240" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Thiết kế đặc trưng</text>
        <text x="680" y="261" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Feature engineering</text>

        <!-- Step 4: split. -->
        <rect x="968" y="188" width="256" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="988" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".14em">04 / CHIA TẬP</text>
        <text x="988" y="240" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Train / validation</text>
        <text x="988" y="261" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Tách trước khi huấn luyện</text>

        <!-- Step 5: training. -->
        <rect x="968" y="420" width="256" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="988" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".14em">05 / HỌC</text>
        <text x="988" y="472" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Huấn luyện mô hình</text>
        <text x="988" y="493" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Học từ tập train</text>

        <!-- Step 6: evaluation is the single focal stage. -->
        <rect x="660" y="420" width="256" height="88" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.6"/>
        <text x="680" y="442" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".14em">06 / ĐIỂM KIỂM TRA</text>
        <text x="680" y="472" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Đánh giá mô hình</text>
        <text x="680" y="493" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">So sánh chỉ số với ngưỡng</text>

        <!-- Decision: pass to deployment or loop back to training. -->
        <polygon points="482,396 566,464 482,532 398,464" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="482" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Đạt yêu cầu?</text>

        <!-- Deployment is the terminal state. -->
        <rect x="44" y="432" width="256" height="64" rx="20" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.3)" stroke-width="1"/>
        <text x="172" y="459" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Triển khai</text>
        <text x="172" y="479" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Đưa vào sử dụng</text>

        <!-- Horizontal legend strip. -->
        <line x1="44" y1="644" x2="1236" y2="644" stroke="rgba(45,49,66,.12)" stroke-width="1"/>
        <text x="44" y="666" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing=".16em">CHÚ GIẢI</text>

        <rect x="44" y="684" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="78" y="694" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Bước xử lý</text>

        <polygon points="264,690 276,684 288,690 276,696" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="694" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Quyết định</text>

        <rect x="480" y="684" width="24" height="12" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.3)" stroke-width="1"/>
        <text x="514" y="694" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Kết thúc</text>

        <line x1="680" y1="690" x2="716" y2="690" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="728" y="694" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Vòng lặp: điều chỉnh và huấn luyện lại</text>

        <rect x="1056" y="684" width="24" height="12" rx="2" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="1090" y="694" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Đánh giá</text>
      </svg>
    </div>
  </main>
</body>
</html>
